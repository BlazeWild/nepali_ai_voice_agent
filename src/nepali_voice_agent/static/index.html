<!doctype html><meta charset="utf-8"><title>Nepali Voice Agent</title><style>body{font:18px system-ui;max-width:700px;margin:4rem auto;padding:1rem}button{font-size:1.2rem;padding:1rem}#out{white-space:pre-wrap}</style><h1>नेपाली आवाज सहायक</h1><button id="b">Hold to speak</button><pre id="out">Ready</pre><script>let r,w,s,ws=new WebSocket(`ws://${location.host}/ws`),o=document.querySelector('#out'),b=document.querySelector('#b');ws.onmessage=e=>{let x=JSON.parse(e.data);o.textContent+=`\n${x.type}: ${x.text||''}`;if(x.type==='audio')new Audio('data:audio/mp3;base64,'+x.data).play()};b.onpointerdown=async()=>{s=await navigator.mediaDevices.getUserMedia({audio:true});r=new MediaRecorder(s);w=[];r.ondataavailable=e=>w.push(e.data);r.start();b.textContent='Release to send'};b.onpointerup=()=>{r.onstop=async()=>ws.send(await new Blob(w,{type:'audio/wav'}).arrayBuffer());r.stop();s.getTracks().forEach(x=>x.stop());b.textContent='Hold to speak'}</script>
