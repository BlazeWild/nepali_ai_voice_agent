<!DOCTYPE html><html lang="ne"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>नेपाली AI Voice Assistant</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070913;--card:rgba(18,22,41,.75);--border:rgba(139,92,246,.2);--primary:#8b5cf6;--glow:rgba(139,92,246,.4);--accent:#ec4899;--text:#f8fafc;--muted:#94a3b8;--success:#10b981;--danger:#ef4444}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;background-image:radial-gradient(circle at 15% 20%,rgba(139,92,246,.15),transparent 40%),radial-gradient(circle at 85% 80%,rgba(236,72,153,.12),transparent 40%)}header{width:100%;max-width:900px;padding:24px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.06)}.logo{font:700 1.4rem Outfit,sans-serif;background:linear-gradient(135deg,#c084fc,#a855f7,#ec4899);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:flex;gap:10px;align-items:center}.badge{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:20px;background:rgba(15,23,42,.6);border:1px solid var(--border);font-size:.85rem;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;background:#64748b}.dot.connected{background:var(--success);box-shadow:0 0 10px var(--success)}.dot.listening{background:var(--primary);box-shadow:0 0 10px var(--primary)}.dot.speaking{background:var(--accent);box-shadow:0 0 10px var(--accent)}.dot.error{background:var(--danger)}main{width:100%;max-width:800px;flex:1;display:flex;flex-direction:column;align-items:center;padding:20px;gap:30px}.orb-section{display:flex;flex-direction:column;align-items:center;margin-top:20px}.orb-wrap{width:160px;height:160px;display:flex;align-items:center;justify-content:center}.orb{border:0;width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#4f46e5,#ec4899);box-shadow:0 0 50px var(--glow);transition:.15s;cursor:pointer;font-size:2.2rem;color:#fff;touch-action:none;user-select:none}.orb:hover{transform:scale(1.04)}.orb.listening{box-shadow:0 0 80px rgba(236,72,153,.7);transform:scale(1.08)}.orb.speaking{animation:pulse 1.5s infinite}.orb:disabled{filter:grayscale(.7);cursor:not-allowed}@keyframes pulse{0%,100%{transform:scale(.95);box-shadow:0 0 30px var(--glow)}50%{transform:scale(1.1);box-shadow:0 0 70px rgba(236,72,153,.7)}}.status{margin-top:16px;font-size:.95rem;color:var(--muted);font-weight:500;min-height:24px;text-align:center}.hint{font-size:.8rem;color:#64748b;margin-top:5px}.chat{width:100%;height:380px;background:var(--card);border:1px solid var(--border);backdrop-filter:blur(16px);border-radius:20px;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;box-shadow:0 10px 30px rgba(0,0,0,.3)}.empty{margin:auto;text-align:center;color:#64748b;line-height:1.8}.message{display:flex;flex-direction:column;max-width:85%;padding:14px 18px;border-radius:16px;font-size:.98rem;line-height:1.5;animation:fade .25s ease-out;white-space:pre-wrap;overflow-wrap:anywhere}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.message.user{align-self:flex-end;background:linear-gradient(135deg,rgba(124,58,237,.3),rgba(79,70,229,.3));border:1px solid rgba(139,92,246,.4);border-bottom-right-radius:4px}.message.assistant{align-self:flex-start;background:rgba(30,41,59,.7);border:1px solid rgba(255,255,255,.08);border-bottom-left-radius:4px}.role{font-size:.75rem;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}footer{padding:16px;font-size:.8rem;color:var(--muted)}@media(max-width:600px){header{padding:18px 14px}.logo{font-size:1.05rem}.badge{padding:5px 9px}.chat{height:45vh;padding:14px}.orb-wrap{width:130px;height:130px}.orb{width:100px;height:100px}}
</style></head><body><header><div class="logo"><span>🎙️</span> नेपाली AI Voice Assistant</div><div class="badge"><span id="dot" class="dot"></span><span id="badgeText">Disconnected</span></div></header><main><section class="orb-section"><div class="orb-wrap"><button id="orb" class="orb" aria-label="Start voice call">🎙️</button></div><div id="status" class="status">Click the orb to start</div><div class="hint">Voice activity detection sends each turn automatically</div></section><section id="chat" class="chat" aria-live="polite"><div id="empty" class="empty">नमस्ते!<br>माइक सुरु गरेर नेपालीमा बोल्नुहोस्।</div></section></main><footer>Nepali Realtime Voice Agent</footer>
<script>
const orb=document.querySelector('#orb'),dot=document.querySelector('#dot'),badge=document.querySelector('#badgeText'),statusEl=document.querySelector('#status'),chat=document.querySelector('#chat');let ws,stream,context,source,processor,connected=false,currentAnswer=null,audioPlayer=null;
function setState(state,text){dot.className='dot '+state;badge.textContent=state==='connected'?'Connected':state==='listening'?'Listening':state==='speaking'?'Speaking':state==='error'?'Error':'Connecting';statusEl.textContent=text;orb.className='orb '+(state==='listening'?'listening':state==='speaking'?'speaking':'')}
async function connect(){if(connected)return disconnect();try{stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});context=new AudioContext({sampleRate:16000});source=context.createMediaStreamSource(stream);processor=context.createScriptProcessor(1024,1,1);const protocol=location.protocol==='https:'?'wss:':'ws:';ws=new WebSocket(`${protocol}//${location.host}/ws/realtime`);ws.onopen=()=>{connected=true;setState('connected','Ready — speak naturally');source.connect(processor);processor.connect(context.destination);processor.onaudioprocess=e=>{if(!connected||ws.readyState!==WebSocket.OPEN)return;const samples=e.inputBuffer.getChannelData(0),pcm=resample(samples,context.sampleRate,16000);ws.send(pcm.buffer)}};ws.onclose=()=>disconnect(false);ws.onerror=()=>setState('error','Connection error');ws.onmessage=event=>handle(JSON.parse(event.data))}catch(error){setState('error','Microphone permission is required')}}
function disconnect(closeSocket=true){connected=false;if(closeSocket&&ws)ws.close();ws=null;if(processor)processor.disconnect();if(source)source.disconnect();if(stream)stream.getTracks().forEach(track=>track.stop());if(context)context.close();processor=source=stream=context=null;setState('','Disconnected — click orb to reconnect')}
function addMessage(kind,text){document.querySelector('#empty')?.remove();const card=document.createElement('div');card.className=`message ${kind}`;const role=document.createElement('div');role.className='role';role.textContent=kind==='user'?'तपाईं (User)':'AI सहायक';const body=document.createElement('div');body.textContent=text;card.append(role,body);chat.append(card);chat.scrollTop=chat.scrollHeight}
function control(type){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type}))}
function handle(msg){if(msg.type==='vad'){if(msg.is_speech)setState('listening','Listening…');else if(!audioPlayer)setState('connected','Ready — speak naturally')}else if(msg.type==='status')statusEl.textContent=msg.data;else if(msg.type==='transcript'){addMessage('user',msg.data);currentAnswer=null;setState('connected','AI is replying…')}else if(msg.type==='token'){if(!currentAnswer){addMessage('assistant',msg.data);currentAnswer=chat.lastElementChild}else currentAnswer.lastElementChild.textContent+=msg.data}else if(msg.type==='audio'){setState('speaking','AI is speaking…');audioPlayer=new Audio(`data:audio/mp3;base64,${msg.data}`);control('playback_start');audioPlayer.onended=()=>{control('playback_end');audioPlayer=null;setState('connected','Ready — speak naturally')};audioPlayer.play().catch(()=>{control('playback_end');audioPlayer=null;setState('connected','Answer ready — audio playback blocked')})}else if(msg.type==='done'){currentAnswer=null;if(!audioPlayer)setState('connected','Ready — speak naturally')}else if(msg.type==='discarded'){if(!audioPlayer)setState('connected','Noise ignored — speak naturally')}else if(msg.type==='interrupted'){if(audioPlayer){audioPlayer.pause();audioPlayer=null}currentAnswer=null;setState('listening','Interrupted — listening…')}else if(msg.type==='error'){addMessage('assistant',`Error: ${msg.data}`);setState('error',msg.data)}}
function resample(input,from,to){if(from===to)return input;const ratio=from/to,size=Math.round(input.length/ratio),out=new Float32Array(size);for(let i=0;i<size;i++){const start=Math.floor(i*ratio),end=Math.min(Math.floor((i+1)*ratio),input.length);let sum=0;for(let j=start;j<end;j++)sum+=input[j];out[i]=sum/Math.max(1,end-start)}return out}
orb.addEventListener('click',connect);
</script></body></html>
